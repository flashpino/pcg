# Uso local / VPS sem painel: `docker compose up -d`.
#
# EasyPanel: use o "App Service" apontando pro repo (ele builda do Dockerfile da raiz
# direto, sem ler este arquivo) + o serviço de banco "Postgres" nativo do EasyPanel —
# é o caminho suportado e documentado. NÃO cole este arquivo no "Compose Service" do
# EasyPanel: ele roda em Docker Swarm, que não suporta `build:` (só `image:` já publicada),
# `env_file:` (só `environment:` inline) nem `depends_on: condition: service_healthy`.
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: pcg
      POSTGRES_USER: pcg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcg"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: .
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgres://pcg:${POSTGRES_PASSWORD}@postgres:5432/pcg
    ports:
      - "3000:3000"
    volumes:
      - firmware-bin:/app/server/firmware-bin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  firmware-bin:
