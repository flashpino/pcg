services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: pcg
      POSTGRES_USER: pcg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcg"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgres://pcg:${POSTGRES_PASSWORD}@postgres:5432/pcg
    ports:
      - "3000:3000"
    volumes:
      - firmware-bin:/app/firmware-bin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  firmware-bin:
