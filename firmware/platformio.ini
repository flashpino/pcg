; Seção [env] = base comum. Duas variantes de tela CYD existem no mercado:
; - esp32dev........ painel que precisa de inversão de cor (as telas originais do projeto)
; - esp32dev-noinv.. painel das telas novas, que mostra cores invertidas com a flag ligada
; Upload USB:  pio run -e esp32dev -t upload      (ou -e esp32dev-noinv)
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Traduz endereço de crash (Guru Meditation / backtrace) em função+linha usando o .elf já
; compilado — sem isso o reset mostra só hex ilegível. "esp32_exception_decoder" é filtro
; nativo da plataforma espressif32, não precisa de dependência nova.
monitor_filters = esp32_exception_decoder
; CH340 do CYD + cabo comum sofre com o default de 460800 ("Invalid head of packet") —
; 115200 é lento porém confiável. Se sua gravação estiver estável, pode subir pra 230400.
upload_speed = 115200
; pós-build: copia o .bin pra dist/ como pcg-<versão>-<env>.bin (distingue as variantes no OTA)
extra_scripts = post:rename_bin.py
; ponytail: min_spiffs troca a tabela default (2x OTA ~1,31MB) por 2x OTA ~1,9MB —
; projeto não usa SPIFFS/LittleFS de verdade, então esse espaço estava sobrando à toa.
board_build.partitions = min_spiffs.csv
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.2.1
    lvgl/lvgl@^8.3.11
    bodmer/TFT_eSPI@^2.5.43
    paulstoffregen/XPT2046_Touchscreen
    0neblock/SNMP_Agent@^2.1.0

; DHT22 no GPIO 27 via conector CN1 (3V3/GND no mesmo conector).
; Pinout confirmado do ESP32-2432S028R (CYD) — TFT em HSPI, touch em VSPI dedicado
; (SPIClass própria em ui.cpp — GOTCHA do plano: nunca compartilhar o barramento do TFT).
build_flags =
    -Iinclude
    -DDHT_PIN=27
    -DLV_CONF_INCLUDE_SIMPLE
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=20000000
    -DSPI_READ_FREQUENCY=16000000
    ; ponytail: fontes do TFT_eSPI removidas — todo texto é desenhado pelo LVGL
    ; (nenhuma chamada a tft.drawString/print em ui.cpp), então essas tabelas
    ; de glifo do TFT_eSPI eram flash morto.
    -DXPT2046_CLK=25
    -DXPT2046_MOSI=32
    -DXPT2046_MISO=39
    -DXPT2046_CS=33
    -DXPT2046_IRQ=36

; Telas originais (painel com inversão de cor necessária)
; TESTE em bancada: RGB_ORDER=1 deu lavanda/rosa lavado em vez de navy/preto —
; trocado pra 0 pra testar a mesma hipótese de R/B invertido que resolveu o noinv.
; Se piorar, volte pra 1.
[env:esp32dev]
build_flags =
    ${env.build_flags}
    -DTFT_INVERSION_ON=1
    -DTFT_RGB_ORDER=0
    -DFW_VARIANT=\"inv\"

; Telas novas (painel que já sai com cor correta sem inversão, mas com R/B trocado —
; confirmado em bancada: #041036 saiu como #361004 vinho no card de umidade).
[env:esp32dev-noinv]
build_flags =
    ${env.build_flags}
    -DTFT_RGB_ORDER=0
    -DFW_VARIANT=\"noinv\"
