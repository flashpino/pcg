[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.2.1
    lvgl/lvgl@^8.3.11
    bodmer/TFT_eSPI@^2.5.43
    paulstoffregen/XPT2046_Touchscreen

; DHT22 no GPIO 27 via conector CN1 (3V3/GND no mesmo conector).
; Pinout confirmado do ESP32-2432S028R (CYD) — TFT em HSPI, touch em VSPI dedicado
; (SPIClass própria em ui.cpp — GOTCHA do plano: nunca compartilhar o barramento do TFT).
build_flags =
    -Iinclude
    -DDHT_PIN=27
    -DLV_CONF_INCLUDE_SIMPLE
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DXPT2046_CLK=25
    -DXPT2046_MOSI=32
    -DXPT2046_MISO=39
    -DXPT2046_CS=33
    -DXPT2046_IRQ=36
